name: Build desktop app

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: WackyPackagesVault-linux
          - os: windows-latest
            artifact: WackyPackagesVault-windows
          - os: macos-latest
            artifact: WackyPackagesVault-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system webview deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 python3-venv

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'

      - name: Install python deps (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv --system-site-packages venv
          venv/bin/pip install -r requirements-desktop.txt

      - name: Install python deps (Windows/macOS)
        if: runner.os != 'Linux'
        run: pip install -r requirements-desktop.txt

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: venv/bin/pyinstaller desktop.spec

      - name: Build (Windows/macOS)
        if: runner.os != 'Linux'
        run: pyinstaller desktop.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
